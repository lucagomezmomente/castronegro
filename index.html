<style>
/* Layout: one-screen table at night — quest track on top, the round table of seats, an action dock at the thumb. */
:root{
  --night:#0b1020; --night2:#121a2f; --stone:#1c2540; --stone2:#27324f;
  --gold:#d6ae58; --gold-hi:#f4dd9c; --ink:#ece4cf; --muted:#9ba4ba;
  --good:#4a86d6; --good-deep:#1d3a73; --evil:#c23a3f; --evil-deep:#5a1418; --lake:#62b8b2;
  --f-display:"IM Fell English SC","Cormorant SC",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}img{max-width:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#18213d 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.75}
#app{position:relative;padding-top:calc(14px + env(safe-area-inset-top,0px))!important;z-index:1;max-width:640px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn{appearance:none;border:1px solid #c9a24f;background:linear-gradient(180deg,#e2bf6c,#b88c37);color:#1b1408;font-family:var(--f-display);font-size:1.15rem;padding:.7em 1.2em;border-radius:6px;box-shadow:0 2px 0 #6e5220,0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,filter .2s;min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #6e5220,0 2px 8px rgba(0,0,0,.4)}
.btn:disabled{background:rgba(214,174,88,.08);color:rgba(244,221,156,.45);border-color:rgba(214,174,88,.25);box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:none;border-color:rgba(214,174,88,.5)}
.btn.blood{background:linear-gradient(180deg,#d4484d,#8e2328);color:#fff3ef;border-color:#e0676b;box-shadow:0 2px 0 #4a0e12,0 6px 18px rgba(0,0,0,.45)}
.btn.wide{width:100%}
.icon-btn{background:rgba(255,255,255,.04);border:1px solid rgba(214,174,88,.3);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:var(--gold-hi)}
.icon-btn svg{width:20px;height:20px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-family:var(--f-display);letter-spacing:.12em;font-size:.8rem;color:var(--gold);text-transform:uppercase}
input.field{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);border:1px solid rgba(214,174,88,.4);border-radius:6px;color:var(--ink);font:inherit;font-size:1.1rem;padding:.7em .8em;min-height:48px}
input.code{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.4em;text-transform:uppercase;text-align:center}
.panel{background:linear-gradient(180deg,rgba(39,50,79,.75),rgba(18,26,47,.85));border:1px solid rgba(214,174,88,.28);border-radius:10px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Hero */
.namebox{border-color:rgba(244,221,156,.5)}.field.big{font-size:1.3rem}#nkhint.warn{color:var(--gold-hi)}.step2{text-align:center;margin-top:4px}.choices2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:600px){.choices2{grid-template-columns:1fr}}.choice{display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-width:0}.choice.featured{border-color:var(--gold-hi);box-shadow:0 0 0 1px rgba(244,221,156,.3),0 10px 30px rgba(0,0,0,.35)}.ch-head{display:flex;gap:12px;align-items:flex-start}.ch-head h2{font-size:1.45rem;color:var(--gold-hi);line-height:1.15}.ch-head p{margin:4px 0 0;font-size:.95rem}.ch-n{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);color:var(--gold-hi)}.ch-n:empty{display:none}.btn.dim{filter:saturate(.3) brightness(.7)}.resume{display:flex;flex-direction:column;gap:10px}.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero-paint{position:relative;isolation:isolate;padding-top:40px}.hero-img{position:absolute;inset:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) -10px;z-index:-1;background-size:cover;background-position:50% 40%;opacity:.55;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%);mask-image:linear-gradient(180deg,#000 30%,transparent 100%);filter:saturate(.85)}.hero-paint p{color:var(--ink);text-shadow:0 1px 8px #000}.hero-paint h1{filter:drop-shadow(0 2px 10px rgba(0,0,0,.8))}
.hero{text-align:center;padding-block:28px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero .crest{width:96px;height:96px;filter:drop-shadow(0 0 22px rgba(214,174,88,.45));animation:breathe 5s ease-in-out infinite}
.hero h1{padding:.12em .1em .18em;line-height:1.2!important;overflow:visible;font-size:clamp(2.6rem,11vw,3.8rem);background:linear-gradient(180deg,var(--gold-hi),#b98a35 70%,#7d5a1f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.hero p{margin:0;max-width:34ch;color:var(--muted);font-style:italic}
@keyframes breathe{50%{transform:scale(1.04);filter:drop-shadow(0 0 30px rgba(214,174,88,.65))}}

/* Top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}.icon-btn{flex:none}
.bar .code-chip{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.25em;color:var(--gold-hi)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.quest{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 30%,#3a4566,#18203a);border:2px solid rgba(214,174,88,.35);font-family:var(--f-display);font-size:1.4rem;color:var(--ink);transition:all .4s}
.quest.choosable{cursor:pointer;border-style:dashed;border-color:rgba(244,221,156,.7)}.quest.locked{opacity:.4}button.quest{padding:0;font:inherit;color:inherit}.quest.cur{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(244,221,156,.15),0 0 18px rgba(214,174,88,.5)}
.quest.ok{background:radial-gradient(circle at 35% 30%,#7fb2f0,#1d3a73);border-color:#9cc4f5}
.quest.ko{background:radial-gradient(circle at 35% 30%,#ef7a7d,#5a1418);border-color:#f19a9c}
.quest svg{width:60%;height:60%}
.quest .two{position:absolute;bottom:-6px;font-size:.62rem;font-family:var(--f-body);background:var(--evil-deep);color:#ffd9d9;border-radius:6px;padding:0 5px;letter-spacing:0}
.rejects{display:flex;gap:6px;align-items:center;justify-content:center}
.rejects i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(214,174,88,.5);display:block}
.rejects i.on{background:var(--evil);border-color:#f19a9c;box-shadow:0 0 8px var(--evil)}
.status{text-align:center;font-size:1.05rem}
.status b{color:var(--gold-hi);font-weight:600}

/* Seats */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.seat{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.15));border:1px solid rgba(214,174,88,.22);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;transition:transform .18s,border-color .2s,box-shadow .2s}
.seat.pickable{cursor:pointer}
.seat.pickable:active{transform:scale(.96)}
.seat.sel{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(244,221,156,.35),0 0 20px rgba(214,174,88,.35)}
.seat.team{background:linear-gradient(180deg,rgba(214,174,88,.18),rgba(0,0,0,.15))}
.mark{font-size:.72rem;letter-spacing:.04em;padding:1px 7px;border-radius:999px;background:rgba(214,174,88,.16);color:var(--gold-hi);border:1px solid rgba(214,174,88,.35)}.seat.marked{border-color:rgba(214,174,88,.55)}.bar{gap:6px}.bar .icon-btn{width:38px;height:38px}.bar .code-chip{font-size:1.1rem;letter-spacing:.15em}@media (max-width:380px){.bar .icon-btn{width:34px;height:34px}.bar{gap:4px}}.icon-btn.on{background:rgba(214,174,88,.25)}.peekbar{text-align:center;font-size:.85rem;color:var(--gold-hi)}

.seat.me .nm::after{content:" (tú)";color:var(--muted);font-size:.8em}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;color:#fff;box-shadow:inset 0 -4px 10px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18)}
.nm{font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px}
.tag.e{background:var(--evil-deep);color:#ffc9cb}
.tag.m{background:#174442;color:#bff0ec}
.badges{position:absolute;top:4px;left:4px;right:4px;display:flex;justify-content:space-between;pointer-events:none}
.badges svg{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.done-dot{position:absolute;bottom:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px var(--gold)}

/* Dock */
.dock{margin-top:4px}@media (max-width:640px){.dock{position:sticky;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:auto}}
.dock .panel{background:linear-gradient(180deg,#222c49,#121a2f);box-shadow:0 -12px 30px rgba(5,8,16,.7);display:flex;flex-direction:column;gap:12px;text-align:center}
.dock h3{font-size:1.35rem;color:var(--gold-hi)}
.choices{display:flex;gap:16px;justify-content:center}
.token{width:96px;height:96px;border-radius:50%;border:none;padding:0;background:none;transition:transform .2s,filter .2s;position:relative}
.token svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.token.on{transform:translateY(-6px) scale(1.06)}
.token.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold-hi);box-shadow:0 0 16px var(--gold)}
.token span{display:block;font-family:var(--f-display);margin-top:6px}
.qcards{display:flex;gap:16px;justify-content:center}
.qcard{width:124px;aspect-ratio:5/7;border-radius:8px;border:none;padding:0;background:none;position:relative;transition:transform .25s}
.qcard svg{width:100%;height:100%;border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.qcard.on{transform:translateY(-10px) rotate(-2deg)}
.qcard.on::after{content:"";position:absolute;inset:-5px;border-radius:12px;border:2px solid var(--gold-hi);box-shadow:0 0 18px var(--gold)}
.qcard:disabled{filter:grayscale(1) brightness(.5)}

/* Role card */
.card3d{position:relative;width:min(74vw,300px);aspect-ratio:5/7;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1);margin:0 auto;cursor:pointer}
.card3d.flipped{transform:rotateY(180deg)}
.card3d.mini{width:100%;cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.face svg{width:100%;height:100%;display:block}
.front{transform:rotateY(180deg)}
.role-info{text-align:center;display:flex;flex-direction:column;gap:6px;max-width:36ch;margin:0 auto}
.role-info h2{font-size:1.8rem}
.role-info .side-good{color:#9cc4f5}
.role-info .side-evil{color:#f19a9c}
.role-info .knows{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;border:1px solid rgba(214,174,88,.25)}

/* Overlay */
#ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,8,16,.86);backdrop-filter:blur(4px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.ov-box{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.ov-box h2{font-size:2rem;color:var(--gold-hi)}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px;width:100%}
.vt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vt .coin{width:64px;height:64px;position:relative;transform-style:preserve-3d;transition:transform .7s}
.vt .coin.flipped{transform:rotateY(180deg)}
.vt .coin > div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.vt .coin > div:last-child{transform:rotateY(180deg)}
.vt .coin svg{width:100%;height:100%}
.qreveal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.qreveal .slot{width:96px;aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .8s}
.qreveal .slot.flipped{transform:rotateY(180deg)}
.qreveal .slot > div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.qreveal .slot > div:last-child{transform:rotateY(180deg)}
.qreveal .slot svg{width:100%;height:100%;border-radius:7px;box-shadow:0 8px 16px rgba(0,0,0,.5)}
.qreveal.shuffling .slot{animation:shuf .5s ease-in-out 3}
@keyframes shuf{25%{transform:translateX(24px) rotate(6deg)}75%{transform:translateX(-24px) rotate(-6deg)}}
.verdict{font-family:var(--f-display);font-size:2.2rem;opacity:0;transform:scale(.7);transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.verdict.show{opacity:1;transform:none}
.verdict.good{color:#9cc4f5;text-shadow:0 0 24px rgba(74,134,214,.8)}
.verdict.evil{color:#f19a9c;text-shadow:0 0 24px rgba(194,58,63,.8)}
.rules{text-align:left;display:flex;flex-direction:column;gap:18px;width:100%}.rules section{display:flex;flex-direction:column;gap:8px}.rules h3{font-size:1.3rem;color:var(--gold-hi);border-bottom:1px solid rgba(214,174,88,.25);padding-bottom:4px}.rules p{margin:0}.rules ol,.rules ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}.tblwrap{overflow-x:auto;width:100%}.rt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}.rt th,.rt td{padding:5px 6px;text-align:center;border-bottom:1px solid rgba(214,174,88,.15)}.rt td:first-child,.rt th:first-child{text-align:left;white-space:nowrap}.rt .hl{background:rgba(214,174,88,.18);color:var(--gold-hi)}.rrole{display:flex;gap:12px;align-items:flex-start}.rrole p{margin:2px 0 0}.rcard{width:64px;flex:none}.rcard svg{width:100%;height:auto;display:block;border-radius:5px}.rrole>div:last-child{min-width:0}
.log{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.log div{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);border-left:3px solid var(--gold)}
.log .ok{border-left-color:var(--good)}
.log .ko{border-left-color:var(--evil)}
.endgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;width:100%}
.endgrid figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.endgrid figcaption{font-size:.8rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 0;border-top:1px solid rgba(214,174,88,.15)}
.opt input{width:22px;height:22px;accent-color:var(--gold)}
.opt div{flex:1;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .pl{display:flex;align-items:center;gap:10px}
.plist .av{width:38px;height:38px;font-size:1.1rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#2a1a10;border:1px solid var(--gold);color:var(--gold-hi);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.flash-good{animation:flg 1.2s}
@keyframes flg{30%{box-shadow:inset 0 0 120px rgba(74,134,214,.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.night{background:radial-gradient(120% 80% at 50% 0%,#0b1226 0%,#03050b 65%) fixed,#03050b}
body{transition:background .8s}
.seat.dead{filter:grayscale(.85);opacity:.6}
.seat.dead .av{opacity:.5}
.rolechip{font-size:.68rem;padding:1px 6px;border-radius:999px;border:1px solid rgba(214,174,88,.35);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolechip.good{background:#1d3a73;color:#dbe8ff}.rolechip.evil{background:#5a1418;color:#ffd6d7}.rolechip.gold{background:#4a3510;color:#f6e3b0}
.mark.pick{background:rgba(194,58,63,.25);border-color:rgba(194,58,63,.6);color:#ffd6d7}
.seatno{font-size:.7rem;color:var(--muted);font-family:var(--f-body)}
.phasebar{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:1.5rem;color:var(--gold-hi);flex-wrap:wrap}
.phasebar svg{width:26px;height:26px}
.wolfvotes{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.9rem}
.chat{max-height:120px;overflow-y:auto;text-align:left;background:rgba(0,0,0,.3);border-radius:8px;padding:8px;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.mini{appearance:none;border:1px solid rgba(214,174,88,.4);background:rgba(255,255,255,.04);color:var(--gold-hi);border-radius:6px;min-width:32px;height:32px;font:inherit;cursor:pointer;flex:none}
.mini:disabled{opacity:.3;cursor:default}
.seatn{width:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.wolfrow{display:flex;align-items:center;gap:12px}.wolfrow>div:first-child{flex:1}
.stepper{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.5rem;color:var(--gold-hi)}
.boxh{font-family:var(--f-display);color:var(--gold);letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;margin-top:8px;border-bottom:1px solid rgba(214,174,88,.2);padding-bottom:3px}
.tag.g{background:#4a3510;color:#f6e3b0}
.badge-wrap{position:relative}.badge{position:absolute;top:-4px;right:-4px;background:var(--evil);color:#fff;font-style:normal;font-size:.65rem;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
.growl{color:#f4dd9c;font-family:var(--f-display);font-size:1.3rem;margin:0;animation:shk .5s 3}
.log .seer{border-left-color:#62b8b2}.log .pack,.log .danger{border-left-color:var(--evil)}.log .love{border-left-color:#e57aa6}.log .charm{border-left-color:#b48ae6}
.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
@media (max-width:420px){.bar .icon-btn{width:33px;height:33px}.bar .icon-btn svg{width:18px;height:18px}.bar{gap:4px}.bar .code-chip{font-size:.95rem;letter-spacing:.08em}}
.seats{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}

const S={ctx:null,on:lsGet('lb_snd')!=='0',
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.7;const comp=this.ctx.createDynamicsCompressor();this.master.connect(comp);comp.connect(this.ctx.destination);
    this.rev=this.ctx.createConvolver();const len=this.ctx.sampleRate*2.2,ir=this.ctx.createBuffer(2,len,this.ctx.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}this.rev.buffer=ir;const rg=this.ctx.createGain();rg.gain.value=.35;this.rev.connect(rg);rg.connect(this.master)}catch(e){}},
  out(){const g=this.ctx.createGain();g.connect(this.master);g.connect(this.rev);return g},
  tone(f,{t=0,dur=.4,type='sine',vol=.3,atk=.005,bend=0}={}){if(!this.on||!this.ctx)return;const c=this.ctx,n=c.currentTime+t,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*bend),n+dur);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+atk);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(this.out());o.start(n);o.stop(n+dur+.05)},
  noise({t=0,dur=.2,f=1500,q=1,vol=.3,type='bandpass',sweep=0}={}){if(!this.on||!this.ctx)return;const c=this.ctx,n=c.currentTime+t,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,n);if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,n+dur);fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(fl);fl.connect(g);g.connect(this.out());s.start(n)},
  bell(f,t=0,vol=.22,dur=2.4){[1,2.76,5.4,8.9].forEach((m,i)=>this.tone(f*m,{t,dur:dur/(i+1),vol:vol/(i*1.6+1),atk:.002}))},

  success(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.bell(f,i*.12,.18))},
  fail(){[1,1.48,2.09,2.93].forEach((m,i)=>this.tone(98*m,{dur:3.2/(i*.5+1),vol:.3/(i+1),atk:.01}));this.noise({dur:1.2,f:180,q:.6,vol:.25,type:'lowpass'})},

  fanfare(good){if(!this.on||!this.ctx)return;const seq=good?[[392,0,.25],[523.25,.25,.25],[659.25,.5,.25],[783.99,.75,.9],[659.25,1.15,.2],[783.99,1.35,1.2]]:[[293.66,0,.35],[277.18,.35,.35],[233.08,.7,.5],[220,1.2,1.4]];

/* ============ Roles ============ */

 aldeano2:{n:'Aldeano-Aldeano',t:'pueblo',d:'Todo el mundo sabe que eres un aldeano honrado: tu carta es pública. Tu palabra tiene peso.'},
 lobo:{n:'Hombre Lobo',t:'lobo',d:'Cada noche, con la manada, elegís a una víctima. De día, disimula.'},
 feroz:{n:'Lobo Feroz',t:'lobo',d:'Cazas con la manada. Mientras no haya caído ningún lobo, cada noche devoras además a una segunda víctima tú solo.'},
 infecto:{n:'Infecto Padre de los Lobos',t:'lobo',d:'Cazas con la manada. Una vez por partida puedes infectar a la víctima en vez de devorarla: se convierte en lobo en secreto y conserva su poder.'},

 caballero:{n:'Caballero de la Espada Oxidada',t:'pueblo',d:'Si los lobos te devoran, el primer lobo a tu izquierda se infecta con tu espada y muere a la mañana siguiente.'},
 angel:{n:'Ángel',t:'solo',d:'La partida empieza de día. Ganas tú solo si mueres en la primera votación o la primera noche. Si no, pasas a ser aldeano.'},
 juez:{n:'Juez Tartamudo',t:'pueblo',d:'Una vez por partida, durante una votación, puedes ordenar en secreto una segunda votación inmediata.'}
};
const PACK_ROLES=new Set(['lobo','feroz','infecto','albino']);
const OPTIONAL=[ // [key, count, box]
 ['vidente',1,'Básico'],['bruja',1,'Básico'],['cazador',1,'Básico'],['cupido',1,'Básico'],['nina',1,'Básico'],['ladron',1,'Básico'],
 ['salvador',1,'Luna Nueva'],['anciano',1,'Luna Nueva'],['tonto',1,'Luna Nueva'],['chivo',1,'Luna Nueva'],['flautista',1,'Luna Nueva'],
 ['feroz',1,'Personajes'],['infecto',1,'Personajes'],['albino',1,'Personajes'],['perrolobo',1,'Personajes'],['salvaje',1,'Personajes'],
 ['zorro',1,'Personajes'],['hermana',2,'Personajes'],['domador',1,'Personajes'],['caballero',1,'Personajes'],['angel',1,'Personajes'],['juez',1,'Personajes'],['aldeano2',1,'Personajes']
];
const recWolves=n=>n<=7?1:n<=11?2:n<=17?3:4;
const teamOfRole=r=>ROLES[r].t;
const HERALD=['#2f5fa8','#8e2b31','#2f7a5a','#7a5a1f','#5b3b86','#2a6d78','#9a4b1d','#4b5a7a','#6f2f5f','#3d6b2a','#7a2f2f','#2f6f6a'];

/* ============ HOST ENGINE (the app is the narrator) ============ */
// Everything here runs only on the host phone. H is the full secret state.
var H=null;var onChange=()=>{};var schedule=(fn,ms)=>setTimeout(fn,ms);
const E={};
function freshHost(c,hostId,hostNick){return{code:c,host:hostId,phase:'lobby',players:[{id:hostId,nick:hostNick}],
 opts:{wolves:2,roles:{vidente:true,bruja:true,cazador:true,cupido:false,nina:false,ladron:false}},
 log:[],inbox:{},chat:{pack:[],sis:[]},startKey:''}}

const alive=id=>!!H.alive[id];
const aliveIds=()=>H.players.map(p=>p.id).filter(alive);
const nk=id=>(H.players.find(p=>p.id===id)||{}).nick||'?';
const roleOf=id=>H.roles[id];
function isPack(id){const r=H.roles[id];return PACK_ROLES.has(r)||!!H.st.infected[id]||(r==='perrolobo'&&H.st.dogWolf===true)||(r==='salvaje'&&H.st.wildTurned)}
const isVillageSide=id=>!isPack(id);

 for(let k=1;k<n;k++){const c=ids[(i-k+n)%n];if(!onlyAlive||alive(c)){L=c;break}}
 for(let k=1;k<n;k++){const c=ids[(i+k)%n];if(!onlyAlive||alive(c)){R=c;break}}return{L,R}}

function pub(e){H.log.push(e)}

/* ---------- start ---------- */
E.validate=function(h){const n=h.players.length,o=h.opts;const specials=OPTIONAL.filter(([k])=>o.roles[k]);const cnt=specials.reduce((a,[,c])=>a+c,0)+o.wolves;
 if(n<5)return'Hacen falta al menos 5 jugadores.';if(o.wolves<1&&!['feroz','infecto','albino'].some(k=>o.roles[k]))return'Tiene que haber al menos un lobo.';

E.start=function(){const h=H,o=h.opts,n=h.players.length;let deck=[];for(let i=0;i<o.wolves;i++)deck.push('lobo');
 for(const [k,c] of OPTIONAL)if(o.roles[k])for(let i=0;i<c;i++)deck.push(k);
 const extra=o.roles.ladron?2:0;while(deck.length<n+extra)deck.push('aldeano');shuffle(deck);
 // the Ladrón must hold a seat, not be left in the middle
 if(extra){const li=deck.indexOf('ladron');if(li>=n){const j=rnd(n);[deck[li],deck[j]]=[deck[j],deck[li]]}}
 h.roles={};h.orig={};h.alive={};h.players.forEach((p,i)=>{h.roles[p.id]=deck[i];h.orig[p.id]=deck[i];h.alive[p.id]=true});
 h.extra=deck.slice(n);h.st={infected:{},charmed:{},lovers:null,model:null,dogWolf:null,wildTurned:false,ancianoLives:2,heal:true,poison:true,lastProtected:null,
  zorroPower:true,infectUsed:false,juezUsed:false,tontoOut:{},powersLost:false,rustyPending:null,packLost:false,sheriff:null,sheriffDone:false,chivoVoters:null,angel:deck.slice(0,n).includes('angel'),angelOver:false};
 h.night=0;h.day=0;h.log=[];h.inbox={};h.chat={pack:[],sis:[]};h.ready={};h.pending=[];h.vote=null;h.stage=null;h.winner=null;h.reason='';h.dawn=null;
 h.startKey='s'+Date.now().toString(36);h.phase='reveal';
 const sis=h.players.map(p=>p.id).filter(id=>h.roles[id]==='hermana');if(sis.length===2)sis.forEach(id=>msg(id,`Tu hermana es ${nk(sis.find(x=>x!==id))}.`));
 const a2=h.players.map(p=>p.id).filter(id=>h.roles[id]==='aldeano2');a2.forEach(id=>pub({t:'a2',id}));
 onChange()};
E.ready=function(pid){if(H.phase!=='reveal')return;H.ready[pid]=1;if(H.players.every(p=>H.ready[p.id])){if(H.st.angel)E.beginDay(true);else E.beginNight()}onChange()};

/* ---------- night ---------- */
E.beginNight=function(){const h=H;h.night++;h.phase='night';h.dawn=null;E.stage(0)};
function packIds(){return aliveIds().filter(isPack)}
function tasksFor(k){const h=H,n1=h.night===1,T={};const add=(id,t)=>(T[id]=T[id]||[]).push(t);
 if(k===0&&n1){const l=holder('ladron');if(l&&alive(l))add(l,{t:'ladron',cards:h.extra.slice()});
  const d=holder('perrolobo');if(d&&alive(d))add(d,{t:'perro'})}
 if(k===1){
  if(n1){const c=holder('cupido');if(c&&powered(c,'cupido'))add(c,{t:'cupido'});const s=holder('salvaje');if(s&&alive(s))add(s,{t:'salvaje'})}
  for(const id of aliveIds()){const r=h.roles[id];
   if(powered(id,'vidente'))add(id,{t:'vidente'});
   if(powered(id,'zorro')&&h.st.zorroPower)add(id,{t:'zorro'});
   if(powered(id,'salvador'))add(id,{t:'salvador',not:h.st.lastProtected});
   if(r==='flautista'&&alive(id))add(id,{t:'flautista'});
   if(powered(id,'nina'))add(id,{t:'nina'});
   if(isPack(id))add(id,{t:'lobos'})}
  for(const id of aliveIds())if(!T[id])add(id,{t:'sospecha'})}
 if(k===2){const V=h.stage.victim;
  const inf=holder('infecto');if(inf&&alive(inf)&&!h.st.infectUsed&&V)add(inf,{t:'infecto',victim:V});
  const fe=holder('feroz');if(fe&&alive(fe)&&!h.st.packLost)add(fe,{t:'feroz',not:V});
  const al=holder('albino');if(al&&alive(al)&&h.night%2===0&&packIds().length>1)add(al,{t:'albino'})}
 if(k===3){const b=holder('bruja');if(b&&powered(b,'bruja')&&(h.st.heal||h.st.poison))add(b,{t:'bruja',victims:E.pendingVictims(),heal:h.st.heal,poison:h.st.poison})}
 return T}
E.stage=function(k){const h=H;if(k>3)return E.dawn();
 const prev=h.stage||{};h.stage={k,tasks:{},sub:{},victim:prev.victim||null,feroz:prev.feroz||null,albino:prev.albino||null,infect:prev.infect||false,protect:prev.protect||null,ninaCaught:prev.ninaCaught||false,wolfPicks:{}};
 if(k===0){h.stage.victim=null;h.stage.feroz=null;h.stage.albino=null;h.stage.infect=false;h.stage.protect=null;h.stage.ninaCaught=false}
 h.stage.tasks=tasksFor(k);h.stage.minEnd=Date.now()+3500+rnd(4000);const any=Object.keys(h.stage.tasks).length>0;
 if(!any){if(k===0)return E.stage(1);
  // nobody acts: still wait a little so nobody can tell which roles are alive
  const key=h.startKey+h.night+'.'+k;h.stage.fake=true;onChange();schedule(()=>{if(H&&H.phase==='night'&&H.stage&&H.stage.k===k&&H.startKey+H.night+'.'+k===key)E.closeStage()},3000+rnd(4000));return}
 onChange()};
const packAgree=()=>{const w=Object.keys(H.stage.tasks).filter(id=>alive(id)&&H.stage.tasks[id].some(t=>t.t==='lobos'));if(!w.length)return true;const p=w.map(id=>H.stage.wolfPicks[id]);return p.every(x=>x&&x===p[0])};
const allTasksDone=()=>Object.entries(H.stage.tasks).every(([id,ts])=>!alive(id)?true:ts.every(t=>H.stage.sub[id]&&t.t in H.stage.sub[id]))&&packAgree();
E.submit=function(pid,t,v){const h=H;if(h.phase!=='night'||!h.stage)return;const ts=h.stage.tasks[pid];if(!ts)return;const task=ts.find(x=>x.t===t);if(!task)return;
 const sub=h.stage.sub[pid]=h.stage.sub[pid]||{};if(t in sub&&t!=='lobos')return;
 const ok=E.validTask(pid,task,v);if(ok!==true)return ok;
 if(t==='lobos'){h.stage.wolfPicks[pid]=v;sub[t]=v}else sub[t]=v;
 if(t==='vidente'){msg(pid,`${nk(v)} es ${ROLES[h.roles[v]].n}.`,'seer')}
 if(t==='zorro'){const {L,R}=seatNeighbours(v);const found=[v,L,R].filter(Boolean).some(isPack);
  msg(pid,found?`Hay al menos un lobo entre ${[L,v,R].filter(Boolean).map(nk).join(', ')}. Conservas tu poder.`:`No hay ningún lobo entre ${[L,v,R].filter(Boolean).map(nk).join(', ')}. Pierdes tu olfato.`,'seer');if(!found)h.st.zorroPower=false}
 if(t==='ladron'&&v!==null&&v!==undefined){/* applied at close */}
 if(allTasksDone()){const st=h.stage;if(st.k>=2){const wait=Math.max(0,st.minEnd-Date.now());if(wait>50){onChange();schedule(()=>{if(H&&H.stage===st)E.closeStage()},wait);return}}E.closeStage()}else onChange()};
E.validTask=function(pid,task,v){const h=H;const isAliveOther=x=>typeof x==='string'&&alive(x)&&x!==pid;
 switch(task.t){
  case'sospecha':return v===null||isAliveOther(v)?true:'x';
  case'vidente':case'zorro':return isAliveOther(v)?true:'x';
  case'salvador':return (typeof v==='string'&&alive(v)&&v!==task.not)?true:'x';
  case'cupido':return Array.isArray(v)&&v.length===2&&v[0]!==v[1]&&v.every(alive)?true:'x';
  case'salvaje':return isAliveOther(v)?true:'x';
  case'flautista':{if(!Array.isArray(v))return'x';const avail=aliveIds().filter(x=>x!==pid&&!h.st.charmed[x]);const need=Math.min(2,avail.length);return v.length===need&&new Set(v).size===need&&v.every(x=>avail.includes(x))?true:'x'}
  case'nina':return typeof v==='boolean'?true:'x';
  case'lobos':return typeof v==='string'&&alive(v)&&!isPack(v)?true:'x';
  case'ladron':{if(v===null)return task.cards.every(c=>PACK_ROLES.has(c))?'Las dos cartas son de lobo: tienes que coger una.':true;return (v===0||v===1)?true:'x'}
  case'perro':return (v==='lobo'||v==='aldeano')?true:'x';
  case'infecto':return typeof v==='boolean'?true:'x';
  case'feroz':return v===null||(typeof v==='string'&&alive(v)&&!isPack(v)&&v!==task.not)?true:'x';
  case'albino':return v===null||(typeof v==='string'&&alive(v)&&isPack(v)&&v!==pid)?true:'x';
  case'bruja':{if(!v||typeof v!=='object')return'x';if(v.heal&&(!task.heal||!task.victims.includes(v.heal)))return'x';if(v.poison&&(!task.poison||!alive(v.poison)))return'x';return true}}
 return'x'};
function wolfVictim(){const picks=Object.values(H.stage.wolfPicks).filter(alive);if(!picks.length){const c=aliveIds().filter(x=>!isPack(x));return c.length?c[rnd(c.length)]:null}
 const t={};picks.forEach(p=>t[p]=(t[p]||0)+1);const max=Math.max(...Object.values(t));const top=Object.keys(t).filter(k=>t[k]===max);return top[rnd(top.length)]}
E.pendingVictims=function(){const s=H.stage,out=[];
 if(s.ninaCaught){out.push(s.ninaCaught)}else if(s.victim&&!s.infect&&s.protect!==s.victim&&!(H.roles[s.victim]==='anciano'&&H.st.ancianoLives>1))out.push(s.victim);
 if(s.feroz&&s.protect!==s.feroz&&!(H.roles[s.feroz]==='anciano'&&H.st.ancianoLives>1)&&!out.includes(s.feroz))out.push(s.feroz);return out};
E.closeStage=function(){const h=H,s=h.stage,k=s.k,get=(id,t)=>s.sub[id]&&s.sub[id][t];
 for(const [id,ts] of Object.entries(s.tasks))for(const t of ts){if(!(s.sub[id]&&t.t in s.sub[id]))(s.sub[id]=s.sub[id]||{})[t.t]=null}
 if(k===0){const l=holder('ladron');if(l&&get(l,'ladron')!==null&&get(l,'ladron')!==undefined){const i=get(l,'ladron');const took=h.extra[i];h.extra[i]='ladron';h.roles[l]=took;msg(l,`Ahora eres ${ROLES[took].n}.`,'role')}
  const d=holder('perrolobo');if(d)h.st.dogWolf=get(d,'perro')==='lobo';if(d&&h.st.dogWolf)msg(d,'Te has unido a la manada.','role')}
 if(k===1){
  const c=Object.keys(s.tasks).find(id=>s.tasks[id].some(t=>t.t==='cupido'));if(c&&get(c,'cupido')){const [a,b]=get(c,'cupido');h.st.lovers=[a,b];msg(a,`Cupido te ha enamorado de ${nk(b)}. Si uno muere, el otro muere de pena.`,'love');msg(b,`Cupido te ha enamorado de ${nk(a)}. Si uno muere, el otro muere de pena.`,'love')}
  const sv=holder('salvaje');if(sv&&get(sv,'salvaje'))h.st.model=get(sv,'salvaje');
  const sa=Object.keys(s.tasks).find(id=>s.tasks[id].some(t=>t.t==='salvador'));h.st.lastProtected=null;if(sa){s.protect=get(sa,'salvador');h.st.lastProtected=s.protect}
  const fl=Object.keys(s.tasks).find(id=>s.tasks[id].some(t=>t.t==='flautista'));if(fl&&get(fl,'flautista')){get(fl,'flautista').forEach(x=>h.st.charmed[x]=true);
   const ch=aliveIds().filter(x=>h.st.charmed[x]);get(fl,'flautista').forEach(x=>msg(x,'El Flautista te ha encantado.','charm'));ch.forEach(x=>msg(x,`Encantados ahora mismo: ${ch.map(nk).join(', ')}.`,'charm'))}
  s.victim=wolfVictim();
  const ni=Object.keys(s.tasks).find(id=>s.tasks[id].some(t=>t.t==='nina'));
  if(ni&&get(ni,'nina')===true){const r=Math.random();const pack=packIds();
   if(r<0.2){s.ninaCaught=ni;msg(ni,'¡Los lobos te han pillado espiando!','danger');pack.forEach(w=>msg(w,`Habéis pillado a ${nk(ni)} espiando: es la Niña Pequeña y será vuestra víctima.`,'pack'))}
   else if(r<0.6&&pack.length){const w=pack[rnd(pack.length)];msg(ni,`Has visto a un lobo: ${nk(w)}.`,'seer')}
   else msg(ni,'Has espiado, pero no has conseguido ver a nadie.','seer')}
  if(s.victim){packIds().forEach(w=>msg(w,`La manada ha elegido a ${nk(s.victim)}.`,'pack'))}}
 if(k===2){const inf=holder('infecto');if(inf&&get(inf,'infecto')===true&&s.victim&&!s.ninaCaught){s.infect=true;h.st.infectUsed=true}
  const fe=holder('feroz');if(fe&&get(fe,'feroz'))s.feroz=get(fe,'feroz');
  const al=holder('albino');if(al&&get(al,'albino'))s.albino=get(al,'albino')}
 if(k===3){const b=holder('bruja');const v=b&&get(b,'bruja');if(v){if(v.heal){s.healed=v.heal;h.st.heal=false}if(v.poison){s.poisoned=v.poison;h.st.poison=false}}}
 E.stage(k+1)};

/* ---------- deaths ---------- */
function killBatch(list){// list of [id,cause]
 const h=H,dead=[];const q=list.filter(([id])=>alive(id));const seen=new Set();
 while(q.length){const [id,cause]=q.shift();if(!alive(id)||seen.has(id))continue;seen.add(id);h.alive[id]=false;dead.push({id,cause,role:h.roles[id]});
  if(isPack(id))h.st.packLost=true;
  if(h.st.lovers&&h.st.lovers.includes(id)){const o=h.st.lovers.find(x=>x!==id);if(alive(o))q.push([o,'pena'])}
  if(h.roles[id]==='anciano'&&['linchado','veneno','cazador'].includes(cause)&&!h.st.powersLost){h.st.powersLost=true;pub({t:'powers'})}
  if(h.roles[id]==='cazador'&&!h.st.powersLost)h.pending.push({t:'cazador',id});
  if(h.st.sheriff===id)h.pending.push({t:'alguacil',id});}
 // wild child
 if(h.st.model&&!alive(h.st.model)&&!h.st.wildTurned){const w=holder('salvaje');if(w&&alive(w)){h.st.wildTurned=true;msg(w,`Tu modelo ${nk(h.st.model)} ha muerto. Ahora eres un lobo.`,'role')}}
 return dead}
E.checkWin=function(){const h=H,al=aliveIds();
 if(!al.length)return E.end('nadie','No queda nadie vivo en Castronegro.');
 const fl=holder('flautista');if(fl&&alive(fl)&&al.filter(x=>x!==fl).every(x=>h.st.charmed[x]))return E.end('flautista',`${nk(fl)}, el Flautista, ha encantado a todo el pueblo.`);
 if(h.st.lovers&&al.length===2&&h.st.lovers.every(alive)&&isPack(h.st.lovers[0])!==isPack(h.st.lovers[1]))return E.end('enamorados',`Solo quedan ${h.st.lovers.map(nk).join(' y ')}, los enamorados.`);
 const pack=al.filter(isPack);const alb=holder('albino');
 if(alb&&alive(alb)&&al.length===1)return E.end('albino',`${nk(alb)}, el Lobo Albino, es el último superviviente.`);
 if(!pack.length)return E.end('pueblo','El pueblo ha acabado con todos los lobos.');
 if(pack.length===al.length)return E.end('lobos','Los lobos han devorado a todo el pueblo.');
 return false};
E.end=function(w,why){H.phase='end';H.winner=w;H.reason=why;H.revealed=Object.assign({},H.roles);pub({t:'end',w,why});onChange();return true};

/* ---------- dawn ---------- */
E.dawn=function(){const h=H,s=h.stage,list=[],notes=[];
 if(h.st.rustyPending&&alive(h.st.rustyPending)){list.push([h.st.rustyPending,'espada']);notes.push('rusty')}h.st.rustyPending=null;
 const attacked=[];
 if(s.ninaCaught){attacked.push(s.ninaCaught)}else if(s.victim){
  if(s.infect){h.st.infected[s.victim]=true;msg(s.victim,'Los lobos te han infectado: ahora eres uno de ellos, en secreto. Conservas tu poder.','role');packIds().forEach(w=>w!==s.victim&&msg(w,`${nk(s.victim)} ha sido infectado y ahora es de la manada.`,'pack'))}
  else attacked.push(s.victim)}
 if(s.feroz&&!attacked.includes(s.feroz))attacked.push(s.feroz);
 for(const v of attacked){if(!alive(v))continue;if(v!==s.ninaCaught&&s.protect===v)continue;if(s.healed===v)continue;
  if(h.roles[v]==='anciano'&&h.st.ancianoLives>1&&v!==s.ninaCaught){h.st.ancianoLives--;msg(v,'Los lobos te han atacado, pero has sobrevivido. El próximo ataque será el último.','danger');continue}
  list.push([v,'lobos']);
  if(h.roles[v]==='caballero'&&!h.st.powersLost){let ids=h.players.map(p=>p.id),i=ids.indexOf(v),n=ids.length;for(let k=1;k<n;k++){const c=ids[(i-k+n)%n];if(alive(c)&&isPack(c)){h.st.rustyPending=c;break}}}}
 if(s.albino)list.push([s.albino,'albino']);
 if(s.poisoned)list.push([s.poisoned,'veneno']);
 // angel: killed the first night
 let angelWin=null;const an=holder('angel');if(h.st.angel&&!h.st.angelOver&&h.night===1){const ang=list.find(([id])=>id===an);if(ang)angelWin=an;h.st.angelOver=true}
 const dead=killBatch(list);
 let growl=false;const dom=holder('domador');if(dom&&powered(dom,'domador')){const {L,R}=seatNeighbours(dom);growl=[L,R].filter(Boolean).some(isPack)||!!h.st.infected[dom]}
 h.dawn={night:h.night,dead,growl,anciano:false};pub({t:'dawn',night:h.night,dead,growl});
 h.day++;h.phase='day';h.stage=null;
 if(angelWin)return E.end('angel',`${nk(angelWin)} era el Ángel y ha muerto la primera noche.`);
 if(E.checkWin())return;
 E.afterDeaths()};
E.beginDay=function(zero){const h=H;h.phase='day';if(zero){h.day=0;h.dawn={night:0,dead:[],growl:false}}E.afterDeaths()};
// resolve hunter shots / sheriff succession, then continue the day
E.afterDeaths=function(){const h=H;
 while(h.pending.length){const p=h.pending[0];if(p.t==='alguacil'&&h.st.sheriff!==p.id){h.pending.shift();continue}
  if(p.t==='cazador'&&aliveIds().length===0){h.pending.shift();continue}
  h.phase='trigger';h.trigger=p;onChange();return}
 h.trigger=null;
 if(E.checkWin())return;
 const next=h.after||'auto';h.after=null;
 if(next==='night')return E.beginNight();
 if(next==='vote2')return E.openVote('lynch2');
 if(h.day>=1&&!h.st.sheriffDone)return E.openVote('sheriff');
 return E.openVote(h.day===0?'lynch0':'lynch')};
E.trigger=function(pid,v){const h=H,p=h.trigger;if(h.phase!=='trigger'||!p||p.id!==pid)return;
 if(p.t==='cazador'){if(!(typeof v==='string'&&alive(v)))return;h.pending.shift();pub({t:'shot',by:pid,target:v});const d=killBatch([[v,'cazador']]);pub({t:'deaths',dead:d});h.lastDeaths=d}
 if(p.t==='alguacil'){if(!(typeof v==='string'&&alive(v)))return;h.pending.shift();h.st.sheriff=v;pub({t:'sheriff',id:v,by:pid})}
 if(p.t==='chivo'){if(!Array.isArray(v))return;h.pending.shift();h.st.chivoVoters=v.filter(alive);pub({t:'chivo',ids:h.st.chivoVoters})}
 if(p.t==='desempate'){if(!p.tied.includes(v))return;h.pending.shift();E.lynch(v,true);return}
 if(E.checkWin())return;E.afterDeaths()};

/* ---------- votes ---------- */
function voters(kind){const h=H;let ids=aliveIds();if(kind!=='sheriff'){ids=ids.filter(id=>!h.st.tontoOut[id]);if(h.st.chivoVoters&&(kind==='lynch'||kind==='lynch2'))ids=ids.filter(id=>h.st.chivoVoters.includes(id))}return ids}
E.openVote=function(kind){const h=H;const el=voters(kind);h.phase='vote';h.vote={kind,votes:{},eligible:el,juez:false,round:h.day+'-'+kind+'-'+Date.now().toString(36)};
 if(!el.length){return E.closeVote()}onChange()};
E.castVote=function(pid,v){const h=H;if(h.phase!=='vote'||!h.vote.eligible.includes(pid))return;if(!(typeof v==='string'&&alive(v)))return;if(h.vote.kind!=='sheriff'&&v===pid)return'No puedes votarte a ti mismo.';
 h.vote.votes[pid]=v;if(h.vote.eligible.every(id=>id in h.vote.votes))E.closeVote();else onChange()};
E.juez=function(pid){const h=H;if(h.phase!=='vote'||!h.vote.kind.startsWith('lynch')||h.vote.kind==='lynch2'||h.st.juezUsed||!powered(pid,'juez'))return;h.st.juezUsed=true;h.vote.juez=true;msg(pid,'Habrá una segunda votación justo después de esta.','info');onChange()};
E.closeVote=function(){const h=H,vt=h.vote;const tally={};for(const [id,t] of Object.entries(vt.votes)){tally[t]=(tally[t]||0)+((vt.kind!=='sheriff'&&h.st.sheriff===id)?2:1)}
 const max=Math.max(0,...Object.values(tally));const top=Object.keys(tally).filter(k=>tally[k]===max);
 pub({t:'vote',kind:vt.kind,votes:vt.votes,tally,day:h.day});
 if(vt.kind!=='sheriff'&&vt.kind!=='lynch2')h.st.chivoVoters=null;
 if(vt.kind==='sheriff'){const w=top.length?top[rnd(top.length)]:null;h.st.sheriff=w;h.st.sheriffDone=true;pub({t:'sheriff',id:w,tie:top.length>1});return E.openVote('lynch')}
 h.afterJuez=vt.juez;
 if(!top.length){pub({t:'nolynch'});return E.endDayVotes()}
 if(top.length>1){const ch=holder('chivo');if(ch&&alive(ch)){pub({t:'tie',tied:top,chivo:ch});return E.lynch(ch,true,'chivo')}
  if(h.st.sheriff&&alive(h.st.sheriff)){h.pending.unshift({t:'desempate',id:h.st.sheriff,tied:top});h.phase='trigger';h.trigger=h.pending[0];pub({t:'tie',tied:top,sheriff:h.st.sheriff});onChange();return}
  pub({t:'tie',tied:top});pub({t:'nolynch'});return E.endDayVotes()}
 E.lynch(top[0],false)};
E.lynch=function(id,fromTie,why){const h=H;
 if(h.roles[id]==='tonto'&&!h.st.tontoOut[id]&&!(h.st.powersLost)){h.st.tontoOut[id]=true;if(h.st.sheriff===id)h.st.sheriff=null;pub({t:'tonto',id});return E.endDayVotes()}
 const first=h.st.angel&&!h.st.angelOver&&h.day===0;
 const d=killBatch([[id,'linchado']]);pub({t:'lynch',id,dead:d});h.lastDeaths=d;
 if(first){if(h.roles[id]==='angel')return E.end('angel',`${nk(id)} era el Ángel y ha conseguido que le linchen el primer día.`)}
 if(why==='chivo'&&h.roles[id]==='chivo')h.pending.push({t:'chivo',id});
 E.endDayVotes()};
E.endDayVotes=function(){const h=H;if(E.checkWin())return;
 if(h.afterJuez){h.afterJuez=false;h.after='vote2'}else h.after='night';
 E.afterDeaths()};

/* ---------- chat ---------- */
E.chat=function(pid,text){const h=H;text=String(text||'').trim().slice(0,140);if(!text||!alive(pid))return;
 if(isPack(pid)&&h.phase==='night')h.chat.pack.push({id:pid,text});
 else if(h.roles[pid]==='hermana'&&h.players.some(p=>p.id!==pid&&h.roles[p.id]==='hermana'))h.chat.sis.push({id:pid,text});else return;onChange()};

/* ---------- per-player view ---------- */
E.viewFor=function(pid){const h=H;const base={code:h.code,host:h.host,phase:h.phase,opts:h.opts,startKey:h.startKey,players:h.players.map(p=>({id:p.id,nick:p.nick}))};
 if(h.phase==='lobby')return base;
 const dead=!alive(pid),showAll=dead||h.phase==='end';
 const pubRoles={};h.players.forEach(p=>{if(!alive(p.id)||showAll)pubRoles[p.id]=h.roles[p.id];if(h.st.tontoOut[p.id])pubRoles[p.id]='tonto';if(h.orig[p.id]==='aldeano2')pubRoles[p.id]='aldeano2'});
 const v=Object.assign(base,{night:h.night,day:h.day,alive:Object.assign({},h.alive),roles:pubRoles,sheriff:h.st.sheriff,log:h.log,dawn:h.dawn,winner:h.winner,reason:h.reason,
  ready:Object.keys(h.ready||{}),powersLost:h.st.powersLost,tontoOut:h.st.tontoOut});
 const me={role:h.roles[pid],orig:h.orig[pid],pack:isPack(pid),infected:!!h.st.infected[pid],dogWolf:h.roles[pid]==='perrolobo'?h.st.dogWolf:undefined,wild:h.roles[pid]==='salvaje'?h.st.wildTurned:undefined,inbox:h.inbox[pid]||[]};
 if(me.pack||showAll)me.packList=aliveIds().filter(isPack).concat(h.players.map(p=>p.id).filter(id=>!alive(id)&&isPack(id)));
 if(h.st.lovers&&(h.st.lovers.includes(pid)||showAll))me.lovers=h.st.lovers;
 if(h.st.charmed[pid]||h.roles[pid]==='flautista'||showAll)me.charmed=Object.keys(h.st.charmed);
 if(h.roles[pid]==='hermana'||showAll)me.sisters=h.players.map(p=>p.id).filter(id=>h.roles[id]==='hermana');
 if(h.roles[pid]==='salvaje')me.model=h.st.model;
 if(h.roles[pid]==='bruja')me.potions={heal:h.st.heal,poison:h.st.poison};
 if(h.roles[pid]==='infecto')me.infectUsed=h.st.infectUsed;
 if(h.roles[pid]==='juez')me.juezUsed=h.st.juezUsed;
 if(h.roles[pid]==='zorro')me.zorroPower=h.st.zorroPower;
 if(h.roles[pid]==='salvador')me.lastProtected=h.st.lastProtected;
 if(me.pack&&h.phase==='night')me.packChat=h.chat.pack;if(me.sisters&&!dead)me.sisChat=h.chat.sis;
 if(showAll){me.all=Object.assign({},h.roles);me.infected=h.st.infected}
 if(h.phase==='night'&&h.stage){const s=h.stage;const done=Object.keys(s.tasks).filter(id=>alive(id)&&s.tasks[id].every(t=>s.sub[id]&&t.t in s.sub[id])).length;
  v.stage={k:s.k,progress:done,total:Object.keys(s.tasks).filter(alive).length,fake:!!s.fake};
  me.tasks=(s.tasks[pid]||[]).map(t=>Object.assign({},t,{done:!!(s.sub[pid]&&t.t in s.sub[pid]),val:s.sub[pid]&&s.sub[pid][t.t]}));
  if(me.pack)me.wolfPicks=s.wolfPicks}
 if(h.phase==='vote'){v.vote={kind:h.vote.kind,eligible:h.vote.eligible,voted:Object.keys(h.vote.votes),round:h.vote.round};me.myVote=h.vote.votes[pid]||null;me.juezCalled=h.vote.juez&&h.roles[pid]==='juez'}
 if(h.phase==='trigger'&&h.trigger){v.trigger={t:h.trigger.t,id:h.trigger.id,tied:h.trigger.tied}}
 v.me=me;return v};

<section><h3>Sin narrador</h3><p>El móvil de quien crea la mesa hace de narrador: reparte, llama a cada personaje, cuenta los votos y anuncia los muertos (también en voz alta, si quieres). Así jugáis todos.</p></section>

  case'seat':if(isHostP&&h.phase==='lobby'){const i=h.players.findIndex(p=>p.id===m.id),j=i+(m.d>0?1:-1);if(i>=0&&j>=0&&j<h.players.length)[h.players[i],h.players[j]]=[h.players[j],h.players[i]]}break;
  case'kick':if(isHostP&&h.phase==='lobby'&&m.id!==h.host){h.players=h.players.filter(p=>p.id!==m.id);const c=conns.get(m.id);if(c){try{c.send({t:'kicked'})}catch(e){}conns.delete(m.id)}}break;
  case'leave':if(h.phase==='lobby'&&pid!==h.host){h.players=h.players.filter(p=>p.id!==pid);conns.delete(pid)}break;
  case'start':if(isHostP&&h.phase==='lobby'){const err=E.validate(h);if(err){reply(pid,err);break}E.start();return}break;
  case'ready':E.ready(pid);return;
  case'task':r=E.submit(pid,m.t,m.v);if(typeof r==='string'){reply(pid,r==='x'?'Esa elección no es válida.':r);break}return;
  case'vote':r=E.castVote(pid,m.v);if(typeof r==='string'){reply(pid,r);break}return;
  case'juez':E.juez(pid);return;
  case'trigger':E.trigger(pid,m.v);return;
  case'chat':E.chat(pid,m.text);return;
  case'restart':case'new':if(isHostP&&h.phase!=='lobby'){const keep=h.players,opts=h.opts;H=freshHost(h.code,h.host,nk(h.host));H.players=keep;H.opts=opts}break;
  default:return}
 broadcast()}

function joinOpen(c){killNet();code=c;isHost=false;view='game';G=null;setLoading(`Buscando la mesa ${c}…`);lsSet('lb_last',c);

 const connect=()=>{if(!peer||peer.destroyed)return;const conn=peer.connect(PREFIX+c,{reliable:true});hostConn=conn;
  const to=setTimeout(()=>{if(!conn.open){try{conn.close()}catch(e){}schedule_()}},9000);
  conn.on('open',()=>{clearTimeout(to);online=true;conn.send({t:'hello',pid:me.id,nick:me.nick});render()});
  conn.on('data',d=>{if(d?.t==='view'){first=false;onView(d.v)}else if(d?.t==='err')toast(d.why);
   else if(d?.t==='deny'){toast(d.why||'No puedes entrar en esta mesa.');lsSet('lb_last','');showHome()}
   else if(d?.t==='kicked'){toast('Te han sacado de la mesa.');lsSet('lb_last','');showHome()}});
  conn.on('close',()=>{clearTimeout(to);if(hostConn===conn){online=false;render();schedule_()}});conn.on('error',()=>{})};
 const schedule_=()=>{clearTimeout(retryT);if(view!=='game'||isHost)return;retryT=setTimeout(connect,2500)};
 peer.on('open',connect);peer.on('disconnected',()=>{setTimeout(()=>{try{peer&&!peer.destroyed&&peer.reconnect()}catch(e){}},1500)});
 peer.on('error',err=>{if(err.type==='peer-unavailable'){online=false;if(first&&!G)setLoading(`No encontramos la mesa ${c}. ¿Quien la creó tiene la app abierta? Reintentando…`);render();schedule_();return}
  if(['network','server-error','socket-error','disconnected'].includes(err.type)){online=false;render();schedule_();return}console.warn(err)})}

  case'share':{const url=shareURL(),txt=`Únete a mi mesa de Castronegro. Código ${code}`;try{if(navigator.share){await navigator.share({title:'Castronegro',text:txt,url});break}}catch(err){if(err.name==='AbortError')break}
   try{await navigator.clipboard.writeText(url);toast('Enlace copiado. Pégalo en el grupo.')}catch(err){toast(url)}break}
  case'rules':S.tap();queueOv(rulesOverlay);break;case'log':S.tap();queueOv(logOverlay);break;case'notes':S.tap();queueOv(notesOverlay);break;
  case'role':S.tap();queueOv(roleOverlay);break;case'endov':S.tap();queueOv(endOverlay);break;case'peek':S.tap();peek();break;case'sis':S.tap();queueOv(sisOverlay);break;
  case'restart':S.tap();queueOv(restartOverlay);break;case'new':send('new');break;
  case'wolves':send('wolves',{v:+a.dataset.v});break;case'preset':send('preset');break;
  case'seat':send('seat',{id:a.dataset.id,d:+a.dataset.d});break;case'kick':send('kick',{id:a.dataset.id});break;
  case'leave':send('leave');lsSet('lb_last','');setTimeout(showHome,300);break;
  case'start':send('start');break;
  case'pick':{S.tap();const id=a.dataset.id,sp=pickSpec();if(!sp)break;
   if(sp.t==='bruja'){witch.poison=witch.poison===id?null:id;render();break}
   if(sel.includes(id))sel=sel.filter(x=>x!==id);else if(sp.n===1)sel=[id];else if(sel.length<sp.n)sel.push(id);render();break}
  case'task':{const t=curTask()||(ME().tasks||[]).find(x=>x.t==='lobos');if(!t)break;const sp=pickSpec();const v=sp.n===1?sel[0]:sel.slice();S.tap();send('task',{t:t.t,v});if(t.t!=='lobos')sel=[];break}
  case'task0':{const t=curTask();if(t){send('task',{t:t.t,v:null});sel=[]}break}
  case'taskv':{const t=curTask();if(!t)break;const raw=a.dataset.v;const v=raw==='true'?true:raw==='false'?false:raw;send('task',{t:t.t,v});break}
  case'lcard':sel=[+a.dataset.i];render();break;
  case'ladron':send('task',{t:'ladron',v:sel[0]});sel=[];break;case'ladron0':send('task',{t:'ladron',v:null});break;
  case'wheal':witch.heal=witch.heal===a.dataset.id?null:a.dataset.id;render();break;case'wpoison0':witch.poison=null;render();break;
  case'bruja':send('task',{t:'bruja',v:{heal:witch.heal||undefined,poison:witch.poison||undefined}});witch={heal:null,poison:null};break;
  case'vote':if(sel.length===1){S.flip();send('vote',{v:sel[0]});sel=[]}break;
  case'juez':send('juez');break;
  case'trig':{const t=G.trigger;send('trigger',{v:t.t==='chivo'?sel.slice():sel[0]});sel=[];break}
  case'chat':{const i=$('#chatin');if(i&&i.value.trim()){send('chat',{text:i.value});i.value=''}break}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('#app .seat[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const k=e.target.dataset?.role;if(!k||!isHost)return;send('role',{k,v:e.target.checked})});
window.addEventListener('beforeunload',e=>{if(isHost&&H&&H.phase!=='lobby'&&H.phase!=='end'){e.preventDefault();e.returnValue=''}});

startEmbers();
if(typeof Peer==='undefined'){$('#app').innerHTML=`<div class="hero">${MOON}<h1>Castronegro</h1><p>Necesitas conexión a internet para jugar. Recarga la página cuando tengas cobertura.</p></div>`}
else showHome();
</script>
</body>
</html>
